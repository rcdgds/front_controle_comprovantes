<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cadastrar Conta</title>
    
    <!-- Script Oficial do Telegram WebApp -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen p-4 flex flex-col justify-between select-none">

    <!-- Container do Formulário -->
    <div class="max-w-md w-full mx-auto space-y-5">
        
        <!-- Cabeçalho -->
        <div class="text-center pt-2">
            <h1 class="text-xl font-bold text-emerald-400">Nova Despesa</h1>
            <p class="text-xs text-gray-300 mt-1">Preencha os dados abaixo para registrar</p>
        </div>

        <form id="contaForm" class="space-y-4">
            
            <!-- Campo 1: Descrição -->
            <div>
                <label for="descricao" class="block text-xs font-semibold text-emerald-400 mb-1">Descrição</label>
                <input type="text" id="descricao" required placeholder="Ex: Mercado, Aluguel, Luz"
                    class="w-full bg-gray-950 border border-gray-600 rounded-lg px-3 py-2 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-emerald-400 focus:ring-1 focus:ring-emerald-400 transition">
            </div>

            <!-- Campo 2: Valor -->
            <div>
                <label for="valor" class="block text-xs font-semibold text-emerald-400 mb-1">Valor (€)</label>
                <input type="number" id="valor" step="0.01" min="0.01" required placeholder="0.00"
                    class="w-full bg-gray-950 border border-gray-600 rounded-lg px-3 py-2 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-emerald-400 focus:ring-1 focus:ring-emerald-400 transition">
            </div>

            <!-- Campo 3: Parcela -->
            <div>
                <label for="numeroDeParcelas" class="block text-xs font-semibold text-emerald-400 mb-1">Número de Parcelas</label>
                <input type="number" id="numeroDeParcelas" required placeholder="Coloque 1 se a compra for à vista"
                    class="w-full bg-gray-950 border border-gray-600 rounded-lg px-3 py-2 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-emerald-400 focus:ring-1 focus:ring-emerald-400 transition">
            </div>

            <!-- Campo 4: Pagador -->
            <div>
                <label for="payerByUser" class="block text-xs font-semibold text-emerald-400 mb-1">Pago por</label>
                <select id="payerByUser" required 
                    class="w-full bg-gray-950 border border-gray-600 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-400 focus:ring-1 focus:ring-emerald-400 transition">
                    <option value="" disabled selected class="text-gray-500">Selecione o pagador</option>
                    <option value="Ricardo" class="bg-gray-900 text-white">Ricardo</option>
                    <option value="Sabrina" class="bg-gray-900 text-white">Sabrina</option>
                </select>
            </div>

            <!-- Campo 5: Categoria -->
            <div>
                <label for="classificacaoDespesa" class="block text-xs font-semibold text-emerald-400 mb-1">Categoria</label>
                <select id="classificacaoDespesa" required 
                    class="w-full bg-gray-950 border border-gray-600 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-400 focus:ring-1 focus:ring-emerald-400 transition">
                    <option value="" disabled selected class="text-gray-500">Selecione uma categoria</option>
                    <option value="CASA" class="bg-gray-900 text-white">Casa</option>
                    <option value="CARRO" class="bg-gray-900 text-white">Carro</option>
                    <option value="LAZER" class="bg-gray-900 text-white">Lazer</option>
                    <option value="OUTROS" class="bg-gray-900 text-white">Outros</option>
                </select>
            </div>

            <!-- Campo 6: Data de Vencimento -->
            <div>
                <label for="dataVencimento" class="block text-xs font-semibold text-emerald-400 mb-1">Data de Vencimento</label>
                <input type="date" id="dataVencimento" required
                    class="w-full bg-gray-950 border border-gray-600 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-400 focus:ring-1 focus:ring-emerald-400 transition">
            </div>

            <!-- Botão de Envio -->
            <button type="submit" id="btnSalvar"
                class="w-full bg-emerald-500 hover:bg-emerald-400 text-gray-950 font-bold py-3 rounded-lg text-sm shadow-md hover:shadow-emerald-500/20 active:scale-[0.98] transition mt-6">
                Salvar Conta
            </button>
        </form>
    </div>

    <!-- Importação do arquivo JavaScript separado -->
    <script src="app.js"></script>
</body>
</html>
